# TASK-04C：每日采集任务（PRD §6.6 定时任务 / §11.1 日更流程）
# cron 10 22 * * * = UTC 22:10 = 北京时间 06:10（青岛统计栏目通常上午更新）；
# workflow_dispatch 可手工指定 run-date 补跑。失败由 Actions 邮件告警（§6.6）。
# 约束：最小 permissions；第三方 Action 固定 commit SHA（项目红线）；
# 生产密钥只走仓库 Secrets（API_BASE / INGEST_HMAC_SECRET），不入本文件。
name: Daily Collect

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      run-date:
        description: "运行日 YYYY-MM-DD（留空 = 当日）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # 第三方 Action 固定 commit SHA（项目红线）：actions/setup-python v5.6.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Install collectors dependencies (locked)
        run: python -m pip install -r collectors/requirements.txt

      - name: Run daily collection (guarded → health → jobs → batch → finish)
        working-directory: collectors
        env:
          API_BASE: ${{ secrets.API_BASE }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
        run: |
          if [ -n "${{ inputs.run-date }}" ]; then
            python -m property_radar_collectors.run_daily --run-date "${{ inputs.run-date }}"
          else
            python -m property_radar_collectors.run_daily
          fi
