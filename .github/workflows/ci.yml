# 房价雷达 CI——依赖 / 格式 / 类型 / 单元测试 / 构建（PRD §12 阶段 1）
# 约束：Private 仓库；最小 permissions；第三方 Action 固定 commit SHA；
# 不含 deploy、不含生产密钥、不依赖 Environment secrets（GitHub Free 限制）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # TASK-04B：Python 连接器框架 fixture 测试（allowlist / HTTP 安全层 / 归一化 / 运行门禁 / 签名）
  collectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # 第三方 Action 固定 commit SHA（项目红线）：actions/setup-python v5.6.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Install collectors dependencies (locked)
        run: python -m pip install -r collectors/requirements.txt

      - name: Collectors fixture tests (no network)
        run: python -m pytest collectors/tests
